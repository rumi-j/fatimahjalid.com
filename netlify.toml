[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.fatimahjalid.com/*"
  to = "https://fatimahjalid.com/:splat"
  status = 301
  force = true

# Hashed build assets never change at a given URL, so let browsers keep them.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
